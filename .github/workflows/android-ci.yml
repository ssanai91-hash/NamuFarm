name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Quote request server tests
        run: node --test server/quote-requests/tests/requests.test.cjs

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Report test totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for failed in suite.findall('.//failure'):
                  print(failed.text)
          print('JUnit totals:', totals)
          PY

      - name: Upload UI previews and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namufarm-ui-review
          path: |
            app/build/outputs/ui-previews/*.png
            app/build/outputs/quote-previews/*
            app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: namufarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
