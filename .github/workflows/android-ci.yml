name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Website protocol and legacy compatibility tests
        run: node --test website/tests/privacy-crypto.test.mjs website/tests/quote-service.test.mjs

      - name: Quote request server tests
        run: node --test server/quote-requests/tests/*.test.cjs

      - name: Configure current server and optional Firebase
        env:
          SCRIPT_URL: ${{ vars.NAMUFARM_WEB_REQUEST_SCRIPT_URL }}
          FIREBASE_APPLICATION_ID: ${{ vars.NAMUFARM_FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.NAMUFARM_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.NAMUFARM_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.NAMUFARM_FIREBASE_SENDER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pc = Path("desktop/namufarm_desktop/api.py").read_text(encoding="utf-8")
          match = re.search(r'^DEFAULT_URL = "(https://script\.google\.com/macros/s/[^"]+/exec)"$', pc, re.M)
          if not match:
              raise SystemExit("The current NamuFarm Apps Script URL was not found.")
          url = os.environ.get("SCRIPT_URL") or match.group(1)
          if not re.fullmatch(r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec', url):
              raise SystemExit("Invalid NamuFarm server URL.")
          lines = ["WEB_REQUEST_SCRIPT_URL=" + url]
          names = ("FIREBASE_APPLICATION_ID", "FIREBASE_API_KEY",
                   "FIREBASE_PROJECT_ID", "FIREBASE_SENDER_ID")
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  if any(c in value for c in "\r\n"):
                      raise SystemExit("Invalid Firebase build setting.")
                  lines.append(name + "=" + value)
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          if not all(os.environ.get(name) for name in names):
              print("FCM build values are incomplete. Push notifications will be unavailable.")
          PY

      - name: Unit tests and debug build
        env:
          # Opt-in, read-only live diagnostic on the active repair branch only.
          NAMUFARM_LIVE_TRANSPORT_CHECK: ${{ github.head_ref == 'fix/local-first-integrity-review' && '1' || '0' }}
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Verify Android key backup in Python desktop
        env:
          PYTHONPATH: desktop
        run: |
          python3 -m pip install --quiet 'cryptography>=44,<52'
          python3 desktop/tests/check_android_backup.py app/build/outputs/desktop-interop/android-backup.json

      - name: Validate generated quote PDFs
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'PYTHON'
          from pathlib import Path
          from pypdf import PdfReader
          expected = {'quote-example.pdf': 1, 'quote-multipage.pdf': None}
          for name, count in expected.items():
              reader = PdfReader(Path('app/build/outputs/quote-previews') / name, strict=True)
              assert len(reader.pages) == count if count else len(reader.pages) > 1
              for page in reader.pages:
                  assert tuple(page.mediabox) == (0, 0, 595, 842)
                  image = page['/Resources']['/XObject']['/Im0'].get_object()
                  assert image['/Width'] == 2380 and image['/Height'] == 3368
              print(name, 'valid pages:', len(reader.pages))
          PYTHON

      - name: Report test totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for failed in suite.findall('.//failure'):
                  print(failed.text)
          print('JUnit totals:', totals)
          PY

      - name: Upload UI previews and test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namufarm-ui-review
          path: |
            app/build/outputs/ui-previews/*.png
            app/build/outputs/quote-previews/*
            app/build/reports/tests/testDebugUnitTest/

      # Debug APKs are for tests only. Ephemeral runner signing keys are never distributed.
      - name: Prepare persistent release signing
        id: signing
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_BASE64: ${{ secrets.NAMUFARM_KEYSTORE_BASE64 }}
          NAMUFARM_STORE_PASSWORD: ${{ secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_KEY_ALIAS: ${{ secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_KEY_PASSWORD: ${{ secrets.NAMUFARM_KEY_PASSWORD }}
          NAMUFARM_SIGNING_SHA256: ${{ vars.NAMUFARM_SIGNING_SHA256 }}
        run: python3 scripts/prepare_android_signing.py

      - name: Build signed seller APK
        if: steps.signing.outputs.ready == 'true'
        env:
          NAMUFARM_KEYSTORE: ${{ runner.temp }}/namufarm-release.jks
          NAMUFARM_STORE_PASSWORD: ${{ secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_KEY_ALIAS: ${{ secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_KEY_PASSWORD: ${{ secrets.NAMUFARM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed seller APK
        id: release_artifact
        continue-on-error: true
        if: steps.signing.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: namufarm-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Draft only: retains repository visibility and never publishes a release.
      - name: Save signed APK as a draft release if artifact upload fails
        if: steps.release_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK."
            exit 1
          fi
          tag="android-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${apks[0]}" --draft \
            --target "$GITHUB_SHA" --title "Android APK ${GITHUB_SHA:0:7}" \
            --notes "Android CI signed APK build. Source commit: $GITHUB_SHA."
          echo "Saved signed APK in draft release: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/namufarm-release.jks"

