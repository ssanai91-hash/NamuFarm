name: Build EXE downloads (Android builds locally)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request main branch EXE build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const builds = [
              ['desktop-exe-build.yml', {}],
            ];
            for (const [workflow_id, inputs] of builds) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo,
                workflow_id, ref: 'main', inputs });
            }
            await core.summary.addHeading('EXE build requested')
              .addRaw('Windows EXE build was requested on main. Android uses local compilation and the original app certificate; no Android workflow was requested. Dispatch success does not imply build/test success.\n\n')
              .addLink('Check each build result and download',
                `https://github.com/${owner}/${repo}/actions`).write();

