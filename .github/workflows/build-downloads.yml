name: Build APK and EXE downloads

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request main branch APK and EXE builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const builds = [
              ['android-apk-build.yml', { apk_type: 'debug' }],
              ['android-apk-build.yml', { apk_type: 'release' }],
              ['desktop-exe-build.yml', {}],
            ];
            for (const [workflow_id, inputs] of builds) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo,
                workflow_id, ref: 'main', inputs });
            }
            await core.summary.addHeading('APK/EXE builds requested')
              .addRaw('Three builds were requested on main: test-only debug APK, permanently signed APK, and Windows EXE. Dispatch success does not imply build/test success.\n\n')
              .addLink('Check each build result and download',
                `https://github.com/${owner}/${repo}/actions`).write();

