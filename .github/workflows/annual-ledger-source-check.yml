name: Annual ledger source check
on:
  push:
    branches: [feature/annual-quote-order-ledgers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact source snapshot for regression testing
        run: git archive --format=zip --output=namufarm-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: annual-ledger-source
          path: namufarm-source.zip
          retention-days: 1
