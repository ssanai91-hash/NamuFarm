name: Storage regression verification

on:
  push:
    branches: [fix/yearly-quote-order-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server regression tests
        run: node --test server/quote-requests/tests/*.test.cjs
      - name: Package source for local regression verification
        if: always()
        run: git archive --format=tar.gz --output=namufarm-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-regression-source
          path: namufarm-source.tar.gz
          retention-days: 1
