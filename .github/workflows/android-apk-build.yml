name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Signing: unsigned for local original-key signing; signed requires matching repository secrets'
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - signed
      previous_version_code:
        description: 'Installed original-app versionCode must be lower than this build (last source version: 45)'
        required: true
        type: string
        default: '45'

permissions:
  contents: read

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Build original-app update APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: android-original-apk-manual
      cancel-in-progress: false
    permissions:
      contents: write # Private draft-release fallback when artifact storage is full.
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use runner Android SDK command-line tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compile release APK without unit or device tests
        id: build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:assembleRelease

      - name: Prepare original-app certificate
        if: inputs.signing_mode == 'signed'
        id: signing
        env:
          SIGNING_BASE64: ${{ secrets.NAMUFARM_INITIAL_KEYSTORE_BASE64 || secrets.NAMUFARM_KEYSTORE_BASE64 }}
          NAMUFARM_STORE_PASSWORD: ${{ secrets.NAMUFARM_INITIAL_STORE_PASSWORD || secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_KEY_ALIAS: ${{ secrets.NAMUFARM_INITIAL_KEY_ALIAS || secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_KEY_PASSWORD: ${{ secrets.NAMUFARM_INITIAL_KEY_PASSWORD || secrets.NAMUFARM_KEY_PASSWORD }}
          # Never trust an old main-app fingerprint or substitute a debug/new key.
          NAMUFARM_SIGNING_SHA256: a31a78a895be8f89bacb2c7b355f413e1cacecfbfd769b257801fcb619e616e1
        run: |
          python3 scripts/prepare_android_signing.py
          if ! grep -q '^ready=true$' "$GITHUB_OUTPUT"; then
            echo "::error::Original-app signing credentials are required. No installable update was produced."
            exit 1
          fi

      - name: Sign and verify original-app update
        if: inputs.signing_mode == 'signed'
        id: signed
        env:
          PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
          NAMUFARM_INITIAL_KEYSTORE: ${{ runner.temp }}/namufarm-release.jks
          NAMUFARM_INITIAL_STORE_PASSWORD: ${{ secrets.NAMUFARM_INITIAL_STORE_PASSWORD || secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_INITIAL_KEY_ALIAS: ${{ secrets.NAMUFARM_INITIAL_KEY_ALIAS || secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_INITIAL_KEY_PASSWORD: ${{ secrets.NAMUFARM_INITIAL_KEY_PASSWORD || secrets.NAMUFARM_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          previous = os.environ["PREVIOUS_VERSION_CODE"]
          if not re.fullmatch(r"[1-9][0-9]*", previous):
              raise SystemExit("A positive installed versionCode is required.")
          apks = list(Path("app/build/outputs/apk/release").glob("*-unsigned.apk"))
          if len(apks) != 1:
              raise SystemExit("Expected one unsigned release APK.")
          source = Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName = "([^"]+)"', source).group(1)
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", version):
              raise SystemExit("Unexpected versionName.")
          code = int(re.search(r"versionCode = (\d+)", source).group(1))
          sha = os.environ["GITHUB_SHA"]
          output = Path("dist") / f"NamuFarm-initial-{version}-{sha[:7]}-update.apk"
          subprocess.run(["python3", "scripts/sign_initial_apk.py",
                          "--unsigned-apk", str(apks[0]), "--previous-version-code", previous,
                          "--build-tools", str(Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0"),
                          "--output", str(output)], check=True)
          record = {"commit": sha, "versionName": version, "versionCode": code,
                    "baselineVersionCode": int(previous), "baselineSource": "manual input; installed device not inspected",
                    "package": "com.example.namufarm.original",
                    "certificateSha256": "a31a78a895be8f89bacb2c7b355f413e1cacecfbfd769b257801fcb619e616e1",
                    "sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
                    "deviceVerification": "not performed"}
          Path("dist/build-info.json").write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Original-app update APK\n\nSource: `{sha}`\n\n")
              summary.write(f"Version: {version} ({code}); certificate and package verified.\n\n")
              summary.write(f"SHA-256: `{record['sha256']}`\n\nNo device, order or message tests performed.\n")
          PY

      - name: Prepare unsigned APK for local original-key signing
        if: inputs.signing_mode == 'unsigned'
        env:
          PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName = "([^"]+)"', source).group(1)
          code = int(re.search(r"versionCode = (\d+)", source).group(1))
          previous = os.environ["PREVIOUS_VERSION_CODE"]
          if not re.fullmatch(r"[1-9][0-9]*", previous) or code <= int(previous):
              raise SystemExit("Candidate must have a higher versionCode than the supplied baseline.")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", version):
              raise SystemExit("Unexpected versionName.")
          apks = list(Path("app/build/outputs/apk/release").glob("*-unsigned.apk"))
          if len(apks) != 1:
              raise SystemExit("Expected exactly one unsigned release APK.")
          dist = Path("dist")
          dist.mkdir()
          sha = os.environ["GITHUB_SHA"]
          output = dist / f"NamuFarm-initial-{version}-{sha[:7]}-unsigned.apk"
          shutil.copy2(apks[0], output)
          # Public SDK tools only. The private original key never leaves local storage.
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0"
          with ZipFile(dist / "android-signing-tools.zip", "w", ZIP_DEFLATED) as archive:
              for name in ("aapt", "zipalign", "apksigner", "lib/apksigner.jar"):
                  archive.write(tools / name, name)
              if (tools / "lib64").is_dir():
                  for file in (tools / "lib64").rglob("*"):
                      if file.is_file():
                          archive.write(file, str(file.relative_to(tools)))
          record = {"commit": sha, "versionName": version, "versionCode": code,
                    "package": "com.example.namufarm.original",
                    "signing": "UNSIGNED - NOT AN INSTALLABLE UPDATE",
                    "baselineVersionCode": int(previous),
                    "sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
                    "deviceVerification": "not performed"}
          (dist / "build-info.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Compilation succeeded\n\nSource: `{sha}`\n\n")
              summary.write(f"Unsigned APK {version} ({code}). Original-key local signing is required before installation.\n")
          PY

      - name: Upload APK build files
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.signing_mode == 'unsigned' && 'NamuFarm-Unsigned-For-Local-Signing' || 'NamuFarm-Original-Update-APK' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Save build as a private draft if artifact storage is full
        if: steps.artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_MODE: ${{ inputs.signing_mode }}
        run: |
          tag="android-initial-${APK_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
            --title "NamuFarm ${APK_MODE} build ${GITHUB_SHA:0:7}" \
            --notes "User-requested main build (${APK_MODE}). Unsigned builds require local original-key signing before installation. No device tests performed."
          echo "APK saved to draft release: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/namufarm-release.jks"
