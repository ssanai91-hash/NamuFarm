name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      apk_type:
        description: 'APK to build (release needs persistent signing secrets)'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build apk]')
    name: Build ${{ inputs.apk_type || 'release' }} APK
    # Job scope is intentional: an unmarked push must not cancel a requested APK.
    concurrency:
      group: android-apk-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
      cancel-in-progress: true
    env:
      APK_TYPE: ${{ github.event_name == 'push' && 'release' || inputs.apk_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # Needed only to save the APK as a draft release.
    steps:
      - name: Coalesce marked pushes before APK setup
        if: github.event_name == 'push'
        run: sleep 30

      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      # Config exists only on the temporary runner, never in the repository.
      # The Android Gradle fallback points to an older deployment URL.
      - name: Configure current server and optional Firebase
        env:
          SCRIPT_URL: ${{ vars.NAMUFARM_WEB_REQUEST_SCRIPT_URL }}
          FIREBASE_APPLICATION_ID: ${{ vars.NAMUFARM_FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.NAMUFARM_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.NAMUFARM_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.NAMUFARM_FIREBASE_SENDER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pc = Path("desktop/namufarm_desktop/api.py").read_text(encoding="utf-8")
          match = re.search(r'^DEFAULT_URL = "(https://script\.google\.com/macros/s/[^"]+/exec)"$', pc, re.M)
          if not match:
              raise SystemExit("The current NamuFarm Apps Script URL was not found.")
          url = os.environ.get("SCRIPT_URL") or match.group(1)
          if not re.fullmatch(r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec', url):
              raise SystemExit("Invalid NamuFarm server URL.")
          lines = ["WEB_REQUEST_SCRIPT_URL=" + url]
          names = ("FIREBASE_APPLICATION_ID", "FIREBASE_API_KEY",
                   "FIREBASE_PROJECT_ID", "FIREBASE_SENDER_ID")
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  if any(c in value for c in "\r\n"):
                      raise SystemExit("Invalid Firebase build setting.")
                  lines.append(name + "=" + value)
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          if not all(os.environ.get(name) for name in names):
              print("FCM build values are incomplete. Push notifications will be unavailable.")
          PY

      # Use the same permanent release certificate as the existing Android CI.
      # Never put the keystore or its passwords into the repository or artifacts.
      - name: Prepare existing release signing
        if: env.APK_TYPE == 'release'
        id: signing
        env:
          SIGNING_BASE64: ${{ secrets.NAMUFARM_KEYSTORE_BASE64 }}
          NAMUFARM_STORE_PASSWORD: ${{ secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_KEY_ALIAS: ${{ secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_KEY_PASSWORD: ${{ secrets.NAMUFARM_KEY_PASSWORD }}
          NAMUFARM_SIGNING_SHA256: ${{ vars.NAMUFARM_SIGNING_SHA256 }}
        run: |
          python3 scripts/prepare_android_signing.py
          if ! grep -q '^ready=true$' "$GITHUB_OUTPUT"; then
            echo "::error::Permanent signing is not configured. Choose debug for compilation only, or set the existing release signing credentials."
            exit 1
          fi

      - name: Build debug APK
        if: env.APK_TYPE == 'debug'
        run: ./gradlew --no-daemon :app:assembleDebug

      # Offline credential tests only; no server requests or order/message trials.
      - name: Verify quote workflow and connection credential preservation
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.example.namufarm.data.WebQuoteRequestTest --tests com.example.namufarm.webrequests.WebRequestSettingsTest --tests com.example.namufarm.quotation.QuoteWorkflowTest --tests com.example.namufarm.ui.QuoteWorkflowUiTest

      - name: Build signed release APK
        if: env.APK_TYPE == 'release'
        env:
          NAMUFARM_KEYSTORE: ${{ runner.temp }}/namufarm-release.jks
          NAMUFARM_STORE_PASSWORD: ${{ secrets.NAMUFARM_STORE_PASSWORD }}
          NAMUFARM_KEY_ALIAS: ${{ secrets.NAMUFARM_KEY_ALIAS }}
          NAMUFARM_KEY_PASSWORD: ${{ secrets.NAMUFARM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK (testing only)
        id: debug_artifact
        continue-on-error: true
        if: env.APK_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: NamuFarm-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save test APK as a draft release if artifact upload fails
        if: env.APK_TYPE == 'debug' && steps.debug_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one debug APK."
            exit 1
          fi
          tag="android-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${apks[0]}" --draft \
            --target "$GITHUB_SHA" --title "Test-only debug APK ${GITHUB_SHA:0:7}" \
            --notes "Testing only. Ephemeral debug certificate; cannot update the permanently signed seller app. Source commit: $GITHUB_SHA."
          echo "Saved test APK in draft release: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        id: release_artifact
        continue-on-error: true
        if: env.APK_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NamuFarm-Signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      # Draft only: retains repository visibility and never publishes a release.
      - name: Save signed APK as a draft release if artifact upload fails
        if: env.APK_TYPE == 'release' && steps.release_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK."
            exit 1
          fi
          tag="android-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${apks[0]}" --draft \
            --target "$GITHUB_SHA" --title "Android APK ${GITHUB_SHA:0:7}" \
            --notes "Manual signed Android APK build. Source commit: $GITHUB_SHA."
          echo "Saved signed APK in draft release: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/namufarm-release.jks"



