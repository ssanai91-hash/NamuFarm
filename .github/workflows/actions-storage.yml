name: Actions storage maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions-storage.yml
      - scripts/actions_artifact_cleanup.cjs
  workflow_run:
    workflows: [Android APK Build, Android CI, Desktop manager CI, Desktop EXE Build]
    types: [completed]
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inventory only; do not delete artifacts'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: namufarm-artifact-storage
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ssanai91-hash/NamuFarm' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute a pull request's code in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify artifact preservation rules
        run: node --test scripts/actions_artifact_cleanup.test.cjs
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const cleanup = require('./scripts/actions_artifact_cleanup.cjs');
            await cleanup({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
