name: Apply and verify annual ledger implementation

on:
  push:
    branches: [feature/annual-quote-order-ledgers]
    paths:
      - .maintenance/annual-ledgers.patch.gz.part1
      - .maintenance/annual-ledgers.patch.gz.part2
      - .maintenance/annual-ledgers.patch.gz.part3
      - .github/workflows/apply-annual-ledgers.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'ssanai91-hash/NamuFarm' && github.ref == 'refs/heads/feature/annual-quote-order-ledgers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and apply exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a506246e8f186e67a0eb7ffb9179741de128e085
          cat .maintenance/annual-ledgers.patch.gz.part1 .maintenance/annual-ledgers.patch.gz.part2 .maintenance/annual-ledgers.patch.gz.part3 > /tmp/annual-ledgers.patch.gz
          echo '7df2c82cd90fff55717d1eadf465165396bff5e64498966da30003ddd23039ea  /tmp/annual-ledgers.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/annual-ledgers.patch.gz > /tmp/annual-ledgers.patch
          echo '39c37608ad49b9aaab43817bfe043bf47c2c54a132f2ddd39022ecc79459c5df  /tmp/annual-ledgers.patch' | sha256sum --check --strict
          git apply --check /tmp/annual-ledgers.patch
          git apply --index /tmp/annual-ledgers.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 20
      - name: Install headless integration test dependency
        run: python -m pip install 'cryptography>=44,<52'
      - name: Run server regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test server/quote-requests/tests/*.test.cjs | tee /tmp/annual-server-tests.log
      - name: Run PC API and paid-order integration tests
        env:
          PYTHONPATH: desktop:desktop/tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest test_api test_annual_ledgers test_simple_connection test_manager.ManagerTest.test_state_workflow_requires_cost_confirmation_and_reports_commission -v 2>&1 | tee /tmp/annual-pc-tests.log
          python -m compileall -q desktop/namufarm_desktop desktop/tests
      - name: Commit verified implementation and remove one-time transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .maintenance/annual-ledgers.patch.gz.part1 .maintenance/annual-ledgers.patch.gz.part2 .maintenance/annual-ledgers.patch.gz.part3 .github/workflows/apply-annual-ledgers.yml .github/workflows/annual-ledger-source-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate annual quote and paid-order Google ledgers'
          git push origin HEAD:feature/annual-quote-order-ledgers
          git rev-parse HEAD > /tmp/annual-implementation-commit.txt
          git archive --format=zip --output=/tmp/NamuFarm-0.4.9-annual-ledgers-source.zip HEAD
      - name: Retain validation results and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-ledger-verified-source
          path: |
            /tmp/annual-server-tests.log
            /tmp/annual-pc-tests.log
            /tmp/annual-implementation-commit.txt
            /tmp/NamuFarm-0.4.9-annual-ledgers-source.zip
          retention-days: 7
