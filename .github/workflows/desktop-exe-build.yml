name: Desktop EXE Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and packager
        run: python -m pip install -e desktop 'pyinstaller>=6.11,<7'
      - name: Build Windows executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NamuFarm-PC --collect-data namufarm_desktop run_desktop.py
      - name: Verify packaged Windows Qt startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $check = Start-Process -FilePath desktop/dist/NamuFarm-PC.exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Packaged application failed with exit code $($check.ExitCode)" }
      - name: Upload Windows executable and instructions
        id: windows_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NamuFarm-PC-Windows
          path: |
            desktop/dist/NamuFarm-PC.exe
            desktop/README.md
          if-no-files-found: error
          retention-days: 30
      - name: Save Windows EXE as a draft release if artifact upload fails
        if: steps.windows_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "desktop-exe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag desktop/dist/NamuFarm-PC.exe desktop/README.md --draft --target $env:GITHUB_SHA --title "NamuFarm-PC $($env:GITHUB_SHA.Substring(0,7))" --notes "Manual Windows executable build. Source commit: $env:GITHUB_SHA."
          if ($LASTEXITCODE -ne 0) { throw "Could not save Windows EXE draft release." }

