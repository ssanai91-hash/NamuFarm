name: CI configuration checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-config-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Check workflow routing and preserved regression commands
        run: python -m unittest discover -s .github/tests -v
