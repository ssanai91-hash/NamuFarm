name: Desktop manager CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "!desktop/**.md"
      - "server/**"
      - ".github/workflows/desktop-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "!desktop/**.md"
      - "server/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:
    inputs:
      build_exe:
        description: 'Package and save a tested Windows EXE (7 days)'
        type: boolean
        default: false

concurrency:
  group: desktop-ci-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Coalesce rapid pushes before Qt setup
        if: github.event_name == 'push'
        run: sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install desktop manager
        run: python -m pip install -e desktop
      - name: Desktop data integrity and Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s desktop/tests -v

  windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop manager
        run: python -m pip install -e desktop
      - name: Install EXE packager only when requested
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe && github.ref == 'refs/heads/main'
        run: python -m pip install 'pyinstaller>=6.11,<7'
      - name: Windows Qt and data tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s desktop/tests -v
      - name: Build Windows executable
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe && github.ref == 'refs/heads/main'
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NamuFarm-PC --collect-data namufarm_desktop run_desktop.py
      - name: Verify packaged Windows Qt startup
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe && github.ref == 'refs/heads/main'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $check = Start-Process -FilePath desktop/dist/NamuFarm-PC.exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Packaged application failed with exit code $($check.ExitCode)" }
      - name: Upload Windows executable and instructions
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe && github.ref == 'refs/heads/main'
        id: windows_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NamuFarm-PC-Windows
          path: |
            desktop/dist/NamuFarm-PC.exe
            desktop/README.md
          if-no-files-found: error
          retention-days: 7
      - name: Save Windows EXE as a draft release if artifact upload fails
        if: steps.windows_artifact.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "desktop-exe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag desktop/dist/NamuFarm-PC.exe desktop/README.md --draft --target $env:GITHUB_SHA --title "NamuFarm-PC $($env:GITHUB_SHA.Substring(0,7))" --notes "Windows CI executable build. Source commit: $env:GITHUB_SHA."
          if ($LASTEXITCODE -ne 0) { throw "Could not save Windows EXE draft release." }



