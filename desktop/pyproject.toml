[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "namufarm-desktop"
version = "0.5.12"
description = "NamuFarm seller workspace with automatic local protection"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<52", "xlwt==1.3.0", "xlrd>=2.0.1,<3"]

[project.scripts]
namufarm-desktop = "namufarm_desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["namufarm_desktop*"]


[tool.setuptools.package-data]
namufarm_desktop = ["assets/*.png"]

