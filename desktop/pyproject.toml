[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "namufarm-desktop"
version = "0.1.0"
description = "Encrypted NamuFarm quote and sales management for desktop"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<52"]

[project.scripts]
namufarm-desktop = "namufarm_desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["namufarm_desktop*"]
